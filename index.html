<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እድል ቢንጎ - Lucky Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
        <h1 class="small-title"></h1>
        <div id="timer-box">የቀረው ጊዜ: <span id="timer">49</span> ሰከንድ</div>
        <div id="live-screen">የተጠራ ቁጥር: <span id="called-number">--</span></div>
    </div>

    <div id="selected-cartela-display" class="hidden">
        <h3>የእርስዎ ካርቴላ (5x5)</h3>
        <div id="bingo-grid" class="grid-5x5"></div>
    </div>

    <div id="game-tab" class="tab-content">
        <div id="bingo-board" class="hidden">
            <h3>የተጠሩ ቁጥሮች ሰሌዳ</h3>
            <div class="board-columns">
                <div class="column"><div class="col-letter">B</div><div id="col-B" class="col-numbers"></div></div>
                <div class="column"><div class="col-letter">I</div><div id="col-I" class="col-numbers"></div></div>
                <div class="column"><div class="col-letter">N</div><div id="col-N" class="col-numbers"></div></div>
                <div class="column"><div class="col-letter">G</div><div id="col-G" class="col-numbers"></div></div>
                <div class="column"><div class="col-letter">O</div><div id="col-O" class="col-numbers"></div></div>
            </div>
        </div>
        <h2 id="select-title">ካርቴላ ይምረጡ (እስከ 5 ካርቴላ)</h2>
        <div id="cartela-list" class="cartela-container"></div>
    </div>

    <div id="wallet-tab" class="tab-content hidden">
        <h2>የእርስዎ የገንዘብ ቦርሳ (Wallet) 💳</h2>
        <div class="wallet-box">
            <div class="wallet-item"><h3>Main Wallet</h3><p id="main-wallet-amount">10.00 ብር</p></div>
            <div class="wallet-item"><h3>Play Wallet</h3><p id="play-wallet-amount">0.00 ብር</p></div>
        </div>
        <div class="deposit-box">
            <h3>ገንዘብ ለማስገባት</h3>
            <p>በቴሌብር ወደዚህ ቁጥር ያስገቡ፡</p>
            <div class="phone-number">0928361886</div>
        </div>
    </div>

    <div id="history-tab" class="tab-content hidden"><h2>ታሪክ 📜</h2><p>ምንም ታሪክ የለም</p></div>
    <div id="profile-tab" class="tab-content hidden"><h2>ፕሮፋይል 👤</h2><p>የተጠቃሚ መረጃ...</p></div>

    <div class="navbar">
        <button id="nav-game" class="nav-item active" onclick="switchTab('game')">🎮 Game</button>
        <button id="nav-wallet" class="nav-item" onclick="switchTab('wallet')">💳 Wallet</button>
        <button id="nav-history" class="nav-item" onclick="switchTab('history')">📜 History</button>
        <button id="nav-profile" class="nav-item" onclick="switchTab('profile')">👤 Profile</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
